name: python_analysis
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pandas=2.0
  - numpy=1.24
  - scipy=1.11
  - scikit-learn=1.3
  - matplotlib=3.7
  - seaborn=0.12
  - pysam=0.21
  - pyvcf3
  - biopython=1.81
  - pip
  - pip:
    - xgboost
    - lightgbm
    - plotly
    - dash  # For interactive dashboards
